# Qualification gate for experiments: oldest/newest supported Rust, every feature
# shape, formatting, strict clippy, docs, package integrity, then trusted publish.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: all features on Rust ${{ matrix.rust }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rust: [stable, "1.90"]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - name: Dependency versions the oldest supported Rust can build
        if: matrix.rust != 'stable'
        run: CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS=fallback cargo +stable generate-lockfile
      - name: Unit, integration, doctest, real Code Passenger qualification
        run: cargo test --all-features
      - name: Package integrity
        run: cargo package --allow-dirty

  feature-matrix:
    name: feature contract — ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: no optional backends
            args: --no-default-features
          - name: differences only
            args: --no-default-features --features differences
          - name: code passenger only
            args: --no-default-features --features code-passenger
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Test feature shape
        run: cargo test ${{ matrix.args }}

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Clippy is warning-free
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Public documentation is warning-free
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --all-features

  consumers:
    # custodian (the host of `experiment run` and `experiment campaign`) as it is now, on the branch of this push's
    # name when it has one, else its default branch, built and tested against this checkout (its ../experiments), with
    # its own siblings beside it and the writer its tests run. custodian is tested only when its experiments resolves to
    # this checkout (a path dependency, no registry source); one that names a version from crates.io, or a version
    # this checkout is not, is said and not built here.
    name: custodian against this checkout
    runs-on: ubuntu-latest
    env:
      CONSUMER: 1o-llc/custodian
      # custodian's own siblings (its CI's SIBLINGS)
      SIBLINGS: 1o-llc/custodian_kit jameshuntt/code_passenger
    steps:
      - uses: actions/checkout@v6
        with:
          path: experiments
      - uses: dtolnay/rust-toolchain@stable
        with:
          # custodian's tests run rustfmt's check
          components: rustfmt
      - name: Clone custodian and its siblings beside this checkout
        run: |
          branch="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          for repo in $CONSUMER $SIBLINGS; do
            name="${repo#*/}"
            git clone --depth 1 --branch "$branch" "https://github.com/$repo.git" "$name" 2>/dev/null \
              || git clone --depth 1 "https://github.com/$repo.git" "$name"
            echo "$name: $(git -C "$name" rev-parse --abbrev-ref HEAD) $(git -C "$name" rev-parse --short HEAD)"
          done
      - name: Build the writer custodian's tests run (code-passenger)
        run: cargo build --manifest-path code_passenger/Cargo.toml --bin code-passenger
      - name: Test custodian when its requirement takes this version
        env:
          CUSTODIAN_TEST_PASSENGER_REQUIRED: "1"
        run: |
          set -o pipefail
          version=$(cargo metadata --no-deps --format-version 1 --manifest-path experiments/Cargo.toml | jq -r '.packages[0].version')
          checkout=$(cd experiments && pwd)/Cargo.toml
          if ! cargo metadata --format-version 1 --manifest-path custodian/Cargo.toml > "$RUNNER_TEMP/custodian.json" 2> "$RUNNER_TEMP/custodian.log"; then
            cat "$RUNNER_TEMP/custodian.log"
            grep -qE 'failed to select a version for the requirement .experiments = ' "$RUNNER_TEMP/custodian.log" || exit 1
            echo "custodian requires an experiments that $version is not: it stays on the version it names; not built here"
            exit 0
          fi
          # the experiments custodian resolves: this checkout (no source, this manifest), or not built here
          resolved=$(jq -r '.packages[] | select(.name == "experiments") | "\(.source) \(.manifest_path)"' "$RUNNER_TEMP/custodian.json")
          echo "custodian resolves experiments to: $resolved"
          if [ "$resolved" != "null $checkout" ]; then
            echo "custodian's experiments is not this checkout (it is $resolved): not built here"
            exit 0
          fi
          (cd custodian && cargo test --all-features)

  publish:
    needs: [test, feature-matrix, quality, consumers]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Is this version already on crates.io?
        id: check
        run: |
          read -r name version < <(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0] | "\(.name) \(.version)"')
          status=$(curl -s -o /dev/null -w '%{http_code}' -A "github.com/${GITHUB_REPOSITORY} CI" "https://crates.io/api/v1/crates/$name/$version")
          case "$status" in
            200) echo "$name $version is already on crates.io; nothing to publish."; echo "publish=false" >> "$GITHUB_OUTPUT" ;;
            404) echo "$name $version is new; publishing."; echo "publish=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "crates.io answered $status for $name $version"; exit 1 ;;
          esac
      - name: CHANGELOG.md has a dated entry for this version
        if: steps.check.outputs.publish == 'true'
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          grep -qE "^## ${version//./\\.} \([0-9]{4}-[0-9]{2}-[0-9]{2}\)" CHANGELOG.md || { echo "CHANGELOG.md has no '## $version (YYYY-MM-DD)' entry; write it first"; exit 1; }
      - uses: rust-lang/crates-io-auth-action@v1
        if: steps.check.outputs.publish == 'true'
        id: auth
      - name: Publish
        if: steps.check.outputs.publish == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          if [ -n "$(git status --porcelain --untracked-files=all -- . ':(exclude)Cargo.lock')" ]; then
            git status --short
            echo "uncommitted changes besides Cargo.lock"
            exit 1
          fi
          cargo publish --allow-dirty
