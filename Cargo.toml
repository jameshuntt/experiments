[package]
name = "experiments"
version = "0.5.0"
edition = "2024"
rust-version = "1.90"
authors = ["James Hunt <james@1o.business>"]
license = "MIT OR Apache-2.0"
description = "A reproducible software experiment instrument: typed command contracts, multi-format specs, bounded mutations, measurements, evidence, scientific evaluation, and results."
repository = "https://github.com/jameshuntt/experiments"
readme = "README.md"
keywords = ["experiments", "science", "benchmark", "reproducibility"]
categories = ["science", "development-tools"]
include = ["src/**", "schema/**", "examples/**", "tests/**", "Cargo.toml", "LICENSE*", "README*", "CHANGELOG*"]

[[bin]]
name = "experiments"
path = "src/main.rs"

[features]
default = ["differences", "code-passenger"]
differences = ["dep:differences_program"]
code-passenger = ["dep:code_passenger"]

[dependencies]
scientific-method = { version = "0.2", features = ["serde"] }
core-1o = "0.2.0"
pathgen = "0.1.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
serde_yaml = "0.9"
# a campaign's digests (an experiment spec's, a plan's, a result file's): SHA-256 over one canonical byte form
stable_digest = "0.1.1"
simple_impl_derive = "0.2.7"
xccute_contract = "0.1.3"
xccute_runtime = "0.1.2"
differences_program = { package = "differences", version = "0.1.0", optional = true }
code_passenger = { package = "code_passenger", version = "0.4.9", default-features = false, features = ["lang_rust"], optional = true }

[dev-dependencies]
tempfile = "3"
